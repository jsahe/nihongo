<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Nihongo">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#f6f5f2" media="(prefers-color-scheme: light)">

<title>Nihongo</title>
<link rel="icon" href="icon.png">
<link rel="apple-touch-icon" href="icon.png">
<style>
:root{
  --bg:#f6f5f2; --card:#ffffff; --text:#1c1d20; --muted:#6b6e76; --line:#e2e0db;
  --accent:#c2410c; --accent-ink:#ffffff; --ok:#1a7f37; --ok-bg:#e3f4e8; --bad:#c62f2f; --bad-bg:#fbe6e6;
  --warn:#8a5a00; --warn-bg:#fff3d6; --chip:#eceae5;
  --p0:#1f6feb; --p1:#d1242f; --pn:#c26a00; --po:#1a7f37; --ink:#1c1d20; --grid:#e6e3dc; --model:#9a9ca3;
  --safe-t:env(safe-area-inset-top,0px); --safe-b:env(safe-area-inset-bottom,0px);
  --safe-l:env(safe-area-inset-left,0px); --safe-r:env(safe-area-inset-right,0px);
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#16171a; --card:#212328; --text:#ecebe8; --muted:#9a9ca3; --line:#33363d;
    --accent:#ff8a4c; --accent-ink:#1a0d05; --ok:#5fd07e; --ok-bg:#183223; --bad:#ff7b7b; --bad-bg:#3a1d1f;
    --warn:#f0c46a; --warn-bg:#3a3018; --chip:#2c2f35;
    --p0:#79a8ff; --p1:#ff8a8a; --pn:#ffb15c; --po:#66d38a; --ink:#ecebe8; --grid:#33363d; --model:#6b6e76;
  }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text)}
body{font:17px/1.55 -apple-system,BlinkMacSystemFont,"Hiragino Sans","Hiragino Kaku Gothic ProN","SF Pro Text","Noto Sans JP",sans-serif;
  padding:calc(var(--safe-t) + 8px) calc(var(--safe-r) + 16px) calc(var(--safe-b) + 84px) calc(var(--safe-l) + 16px);
  -webkit-text-size-adjust:100%}
h1{font-size:28px;line-height:1.2;margin:8px 0 4px}
h2{font-size:21px;line-height:1.25;margin:20px 0 8px}
h3{font-size:18px;margin:16px 0 6px}
p{margin:8px 0}
.muted{color:var(--muted)}
.small{font-size:15px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin:12px 0}
button,.btn{font:inherit;font-size:17px;min-height:44px;min-width:44px;border-radius:12px;border:1px solid var(--line);
  background:var(--card);color:var(--text);padding:10px 16px;cursor:pointer}
button.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
button.big{width:100%;min-height:54px;font-size:18px}
button:disabled{opacity:.45}
button.link{border:none;background:none;color:var(--accent);padding:10px 4px}
input[type=text],textarea,select{font:inherit;font-size:17px;width:100%;min-height:44px;border-radius:10px;border:1px solid var(--line);
  background:var(--bg);color:var(--text);padding:10px 12px}
textarea{min-height:96px;resize:vertical}
input.blank{display:inline-block;width:auto;min-width:90px;max-width:100%;margin:2px 4px;padding:6px 10px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.row > *{flex:1 1 auto}
.bar{height:8px;border-radius:4px;background:var(--chip);overflow:hidden;margin:8px 0}
.bar > div{height:100%;background:var(--accent);transition:width .25s}
.chip{display:inline-block;padding:2px 10px;border-radius:999px;background:var(--chip);font-size:14px;margin:2px 4px 2px 0}
.ok{color:var(--ok)} .bad{color:var(--bad)}
.fb{border-radius:10px;padding:10px 12px;margin-top:10px;font-size:16px}
.fb.ok{background:var(--ok-bg)} .fb.bad{background:var(--bad-bg)} .fb.warn{background:var(--warn-bg);color:var(--warn)}
.opt{display:block;width:100%;text-align:left;margin:6px 0}
.opt.sel-ok{background:var(--ok-bg);border-color:var(--ok)}
.opt.sel-bad{background:var(--bad-bg);border-color:var(--bad)}
.item{border-top:1px solid var(--line);padding:14px 0}
.item:first-child{border-top:none}
.prompt{font-size:19px;margin-bottom:8px}
.tabbar{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--card);border-top:1px solid var(--line);
  padding:4px calc(var(--safe-r) + 2px) calc(var(--safe-b) + 4px) calc(var(--safe-l) + 2px);z-index:5}
.tabbar button{flex:1;border:none;background:none;border-radius:10px;font-size:12px;min-height:52px;color:var(--muted);padding:6px 0;min-width:0}
.tabbar button .ic{display:block;font-size:19px;line-height:1.15}
.tabbar button.on{color:var(--accent);font-weight:600}
.day{display:flex;align-items:center;gap:12px;width:100%;text-align:left;margin:8px 0;padding:12px 14px}
.day .dot{width:14px;height:14px;border-radius:50%;flex:0 0 14px;border:2px solid var(--muted)}
.day .dot.done{background:var(--ok);border-color:var(--ok)}
.day .dot.part{background:linear-gradient(90deg,var(--accent) 50%,transparent 50%);border-color:var(--accent)}
.day .grow{flex:1}
.day.today{border-color:var(--accent)}
.overlay{position:fixed;inset:0;background:var(--bg);z-index:10;display:none;flex-direction:column}
.overlay.open{display:flex}
.ohead{padding:calc(var(--safe-t) + 6px) calc(var(--safe-r) + 12px) 6px calc(var(--safe-l) + 12px);border-bottom:1px solid var(--line);background:var(--card)}
.obody{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:8px calc(var(--safe-r) + 16px) 24px calc(var(--safe-l) + 16px)}
.ofoot{display:flex;gap:10px;padding:10px calc(var(--safe-r) + 12px) calc(var(--safe-b) + 10px) calc(var(--safe-l) + 12px);border-top:1px solid var(--line);background:var(--card)}
.ofoot > button{flex:1}
.otitle{flex:1;text-align:center;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.flip{display:block;width:100%;min-height:96px;margin:8px 0;text-align:center;font-size:24px;font-weight:600}
.flip .ex{display:block;font-size:15px;font-weight:400;color:var(--muted);margin-top:6px}
.flip.back{background:var(--chip)}
.tokens{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}
.tokens button{padding:8px 12px}
.built{min-height:52px;border:1px dashed var(--line);border-radius:10px;padding:4px}
.match{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.match button{width:100%;text-align:left;font-size:16px}
.match button.picked{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent) inset}
.match button.done{background:var(--ok-bg);border-color:var(--ok)}
.match button.flash{background:var(--bad-bg);border-color:var(--bad)}
.md table{border-collapse:collapse;width:100%;font-size:16px;margin:8px 0;display:block;overflow-x:auto}
.md th,.md td{border:1px solid var(--line);padding:6px 8px;text-align:left}
.md ul,.md ol{padding-left:22px;margin:6px 0}
.jp{font-size:19px;line-height:2.0}
ruby rt{font-size:.55em;color:var(--muted)}
.fw{border-bottom:1px dotted transparent;cursor:pointer}
.fw.show{border-bottom-color:var(--muted)}
.fw .tip{display:none}
.fw.show .tip{display:inline;font-size:.6em;color:var(--accent);margin-left:1px}
pre.report{white-space:pre-wrap;word-break:break-word;font:14px/1.45 ui-monospace,Menlo,monospace;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px}
.rate button{flex:1}
.rate button.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--safe-b) + 90px);background:var(--text);color:var(--bg);padding:10px 16px;border-radius:12px;z-index:20;font-size:15px;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.show{opacity:1}
/* pitch accent */
.pitch{display:inline-flex;align-items:flex-end;font-size:1em;letter-spacing:.02em}
.pitch .m{display:inline-block;padding-top:3px;border-top:2px solid transparent}
.pitch .m.hi{border-top-color:currentColor}
.pitch .m.drop{border-right:2px solid currentColor}
.pitch .pn{font-size:.7em;margin-left:4px;opacity:.8}
.pa-0{color:var(--p0)} .pa-1{color:var(--p1)} .pa-n{color:var(--pn)} .pa-o{color:var(--po)}
/* flashcards */
.fc{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;margin:12px 0;text-align:center}
.fc-en{font-size:22px;font-weight:600}
.fc-jp{font-size:40px;font-weight:600;margin:6px 0;line-height:1.3}
.fc-sub{color:var(--muted);font-size:16px;margin:4px 0}
.fc-read{font-size:24px;margin:6px 0}
.fc-ex{font-size:19px;margin-top:12px;line-height:2}
.fc-notes{font-size:15px;color:var(--muted);margin-top:10px;border-top:1px dashed var(--line);padding-top:8px;text-align:left}
.fc-tag{font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.imgbox img{max-width:100%;max-height:200px;border-radius:12px;display:block;margin:12px auto 4px}
.credit{font-size:12px;color:var(--muted)} .credit a{color:var(--muted)}
.spk{min-width:44px;min-height:44px;padding:4px 8px;border:none;background:none;font-size:20px;vertical-align:middle}
.small-btn{font-size:15px}
.rategrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;width:100%}
.rb{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:6px 4px;font-weight:600;font-size:16px;min-height:56px}
.rb .ivl{font-size:13px;font-weight:400;color:var(--muted)}
.rb.again{color:var(--bad)} .rb.good{color:var(--ok)} .rb.easy{color:var(--accent)}
.rb.sug{box-shadow:0 0 0 2px var(--accent) inset}
.stats3{display:flex;text-align:center} .stats3>div{flex:1} .stats3 strong{display:block;font-size:30px} .stats3 span{font-size:14px;color:var(--muted)}
.c-new{color:var(--p0)} .c-learn{color:var(--bad)} .c-rev{color:var(--ok)}
.warnbox{background:var(--warn-bg);border-color:var(--warn)}
hr{border:none;border-top:1px solid var(--line);margin:14px 0}
.vrow{display:flex;align-items:center;gap:6px} .vrow .flip{flex:1}
.setrow{display:flex;align-items:center;gap:12px;margin:10px 0} .setrow > span{flex:1}
.setrow input,.setrow select{width:auto;min-width:120px;flex:0 0 auto}
input[type=number]{font:inherit;font-size:17px;min-height:44px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--text);padding:10px 12px}
/* writing pad */
.pad{position:relative;margin:10px auto;border:1px solid var(--line);border-radius:14px;background:var(--card);touch-action:none;-webkit-user-select:none;user-select:none;overflow:hidden}
.pad svg,.pad canvas{position:absolute;inset:0;width:100%;height:100%}
.pad canvas{touch-action:none}
.pad .gl{stroke:var(--grid);stroke-width:.6;stroke-dasharray:2 2;fill:none}
.pad .ms{fill:none;stroke:var(--ink);stroke-width:3.6;stroke-linecap:round;stroke-linejoin:round}
.pad .ms.ghost{stroke:var(--model);opacity:.35}
.pad .ms.hint{stroke:var(--accent);opacity:.75}
.pad .ms.bad{stroke:var(--bad)}
.pad .num{font-size:5px;fill:var(--accent)}
.padbar{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.padbar button{font-size:15px;min-height:40px;padding:6px 12px}
.padmsg{text-align:center;min-height:24px;font-size:15px;margin:4px 0}
.model{width:120px;height:120px;margin:4px auto;display:block}
.model path{fill:none;stroke:var(--ink);stroke-width:3.4;stroke-linecap:round;stroke-linejoin:round}
.blankword{font-size:32px;letter-spacing:.05em}
.blankword .bk{display:inline-block;width:1.05em;border-bottom:3px solid var(--accent);margin:0 2px;color:transparent}
/* kanji map */
.kgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(38px,1fr));gap:4px}
.kgrid button{min-height:38px;min-width:0;padding:0;font-size:20px;border-radius:8px;border:1px solid var(--line);background:var(--card)}
.kgrid .s-read{background:color-mix(in srgb,var(--p0) 18%,var(--card))}
.kgrid .s-learn{background:color-mix(in srgb,var(--pn) 30%,var(--card))}
.kgrid .s-write{background:color-mix(in srgb,var(--po) 35%,var(--card))}
.legend span{display:inline-block;width:14px;height:14px;border-radius:4px;vertical-align:-2px;margin:0 4px 0 10px;border:1px solid var(--line)}
.kbig{font-size:64px;text-align:center;line-height:1.1}
.comps{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px;font-size:16px}
.comps div{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:6px 10px}
.comps b{font-size:22px;margin-right:8px;font-weight:500}
</style>

<body>
<main id="app"></main>

<nav class="tabbar" id="tabbar">
  <button data-tab="today"><span class="ic">☀︎</span>今日</button>
  <button data-tab="cards"><span class="ic">🂠</span>カード</button>
  <button data-tab="week"><span class="ic">▦</span>週</button>
  <button data-tab="kanji"><span class="ic">字</span>漢字</button>
  <button data-tab="report"><span class="ic">✓</span>報告</button>
  <button data-tab="settings"><span class="ic">⚙︎</span>設定</button>
</nav>

<section id="player" class="overlay" aria-modal="true">
  <div class="ohead">
    <div class="row" style="flex-wrap:nowrap">
      <button class="link" id="pClose" style="flex:0 0 auto">✕ Close</button>
      <div id="pTitle" class="otitle"></div>
      <div id="pCount" class="muted small" style="flex:0 0 auto;text-align:right;min-width:56px"></div>
    </div>
    <div class="bar"><div id="pBar" style="width:0"></div></div>
  </div>
  <div id="pBody" class="obody"></div>
  <div id="pFoot" class="ofoot">
    <button id="pBack">‹ Back</button>
    <button id="pNext" class="primary">Next ›</button>
  </div>
</section>

<section id="study" class="overlay" aria-modal="true">
  <div class="ohead">
    <div class="row" style="flex-wrap:nowrap">
      <button class="link" id="sClose" style="flex:0 0 auto">✕ Close</button>
      <div id="sCount" class="otitle"></div>
      <button class="link" id="sUndo" style="flex:0 0 auto">↶ Undo</button>
    </div>
  </div>
  <div id="sBody" class="obody"></div>
  <div id="sFoot" class="ofoot"></div>
</section>

<section id="sheet" class="overlay" aria-modal="true">
  <div class="ohead">
    <div class="row" style="flex-wrap:nowrap">
      <button class="link" id="xClose" style="flex:0 0 auto">✕ Close</button>
      <div id="xTitle" class="otitle"></div>
      <div id="xCount" class="muted small" style="flex:0 0 auto;text-align:right;min-width:56px"></div>
    </div>
    <div class="bar" id="xBarWrap"><div id="xBar" style="width:0"></div></div>
  </div>
  <div id="xBody" class="obody"></div>
  <div id="xFoot" class="ofoot"></div>
</section>

  (store.get("imported",[])||[]).forEach(w=>{ if(!map[w.week]) map[w.week]={week:w.week,startDate:w.startDate,file:null}; });

}
function findCurrent(list){
  const t=today();
  const hit=list.find(w=>{ const s=parseDate(w.startDate); if(!s) return false; const d=daysBetween(s,t); return d>=0 && d<7; });
  return hit ? hit.week : null;
}
function getWeek(n){ if(S.weeks[n]) return S.weeks[n]; const w=store.get("week_"+pad2(n),null); if(w) S.weeks[n]=w; return w; }

async function fetchJSON(url,bust){
  const r = await fetch(bust===false?url:url+(url.indexOf("?")>-1?"&":"?")+"t="+Date.now(),{cache:bust===false?"default":"no-store"});
  if(!r.ok) throw new Error("HTTP "+r.status);
  return r.json();
}
async function loadWeekFile(entry){
  if(!entry || !entry.file) return getWeek(entry && entry.week);
  try{
    const w = await fetchJSON(entry.file);
    const err = validateWeek(w);
    if(err) throw new Error(err);
    S.weeks[w.week]=w; store.set("week_"+pad2(w.week), w);
    return w;

}

  const key="data_"+name;

  catch(e){ return store.get(key,null); }

    const idx = await fetchJSON("weeks/index.json");

function resKey(n){ return "results_"+pad2(n); }
function getRes(n){ const r=store.get(resKey(n),null); return r && r.days ? r : {days:{}}; }
function dayRes(res,d){ if(!res.days[d]) res.days[d]={items:{},ratings:{},timeMs:0,notes:"",visited:[],done:false,last:0}; return res.days[d]; }

function dayStats(week,d){
  const res=getRes(week.week); const dr=res.days[d];
  const day=week.days.find(x=>x.day===d);
  const total = day ? day.sections.length : 0;

/* ---------- Japanese text helpers ---------- */
const KANJI_RE=/[㐀-䶿一-鿿豈-﫿々〆]/;
const KANJI_G=/[㐀-䶿一-鿿豈-﫿]/g;
function hasKanji(s){ return KANJI_RE.test(String(s||"")); }
function isJa(s){ return /[぀-ヿ㐀-鿿々]/.test(String(s||"")); }
function kanjiIn(s){ return (String(s||"").match(KANJI_G)||[]); }
function kataToHira(s){ return String(s).replace(/[ァ-ヶ]/g,c=>String.fromCharCode(c.charCodeAt(0)-0x60)); }
/* compare Japanese answers: NFKC, katakana→hiragana, drop spaces and punctuation */
function jnorm(s){ return kataToHira(String(s==null?"":s).normalize("NFKC")).replace(/[\s、。，．,.!?！？「」『』（）()・~～〜…]/g,"").toLowerCase(); }
function norm(s,keepCase){
  let t=String(s==null?"":s).normalize("NFC").replace(/[‘’]/g,"'").replace(/[“”„]/g,'"').trim().replace(/\s+/g," ");
  t=t.replace(/[.!?,;:…。！？]+$/,"").trim();
  return keepCase ? t : t.toLowerCase();
}
/* returns {ok, kanji:true if the answer was typed with kanji (rejected: readings are typed in kana)} */
function checkAnswer(user, accepted, keepCase){
  const ja=accepted.some(isJa);
  if(ja){
    const u=jnorm(user); if(!u) return {ok:false};
    if(hasKanji(user) && !accepted.some(a=>hasKanji(a) && jnorm(a)===u)) return {ok:false,kanji:true};
    return {ok:accepted.some(a=>jnorm(kanaOf(a))===u || jnorm(a)===u)};
  }
  const u=norm(user,keepCase); if(!u) return {ok:false};
  return {ok:accepted.some(a=>norm(a,keepCase)===u)};
}
function similarity(a,b){ // 1 - normalized Levenshtein distance
  a=Array.from(a); b=Array.from(b); if(!a.length && !b.length) return 1;
  const dp=Array(b.length+1).fill(0).map((_,j)=>j);
  for(let i=1;i<=a.length;i++){ let prev=dp[0]; dp[0]=i; for(let j=1;j<=b.length;j++){ const t=dp[j]; dp[j]=Math.min(dp[j]+1,dp[j-1]+1,prev+(a[i-1]===b[j-1]?0:1)); prev=t; } }
  return 1-dp[b.length]/Math.max(a.length,b.length);
}

/* ---------- furigana markup: {漢字|かんじ} ---------- */
const FURI_RE=/\{([^{}|]+)\|([^{}]+)\}/g;
function kanaOf(t){ return String(t==null?"":t).replace(FURI_RE,"$2"); }
function baseOf(t){ return String(t==null?"":t).replace(FURI_RE,"$1"); }
let KNOWN=null;
function knownKanji(){
  if(KNOWN) return KNOWN;
  const k=new Set(); const pl=getPL();
  Object.keys(pl.parts||{}).forEach(p=>{ const a=pl.parts[p].ans||{}; Object.keys(a).forEach(id=>{ if(a[id].read===true && id.length===1) k.add(id); if(a[id].write===true && id.length===1) k.add(id); }); });
  const srs=store.get("srs",{}); const byId={}; allCards().forEach(c=>byId[c.id]=c);
  Object.keys(srs).forEach(id=>{ const s=srs[id]; const c=byId[id]; if(!c || s.st!==2) return;
    if(c.type==="write" && c.kanji) k.add(c.kanji); else kanjiIn(baseOf(c.de)).forEach(x=>k.add(x)); });
  KNOWN=k; return k;
}
function furiMode(){ return getCfg().furigana||"auto"; }
function needsRuby(base){ const m=furiMode(); if(m==="all") return true; if(m==="none") return false; const kn=knownKanji(); return kanjiIn(base).some(x=>!kn.has(x)); }
function furiHTML(s){ // s is already HTML-escaped
  return s.replace(FURI_RE,(m,b,r)=> needsRuby(b) ? "<ruby>"+b+"<rt>"+r+"</rt></ruby>" : "<span class='fw' data-b='"+b+"'>"+b+"<span class='tip'>"+r+"</span></span>");
}
/* tapping a word shown without furigana reveals its reading; every lookup is logged for the report */
document.addEventListener("click",e=>{
  const w=e.target.closest && e.target.closest(".fw"); if(!w) return;
  const on=!w.classList.contains("show"); w.classList.toggle("show",on);
  if(on){ const log=store.get("lookups",[])||[]; log.push([w.dataset.b,Math.round(Date.now()/1000)]); if(log.length>3000) log.splice(0,log.length-3000); store.set("lookups",log); }
});

/* ---------- pitch accent: kana + nucleus number (0 heiban, 1 atamadaka, n odaka, else nakadaka) ---------- */
const SMALL_KANA="ゃゅょぁぃぅぇぉゎャュョァィゥェォヮ";
function morae(r){ const out=[]; for(const ch of String(r||"")){ if(SMALL_KANA.indexOf(ch)>-1 && out.length) out[out.length-1]+=ch; else out.push(ch); } return out; }
function pitchKind(n,p){ if(p===0) return "0"; if(p===1) return "1"; if(p===n) return "o"; return "n"; }
const PITCH_NAMES={"0":"heiban (flat)","1":"atamadaka","n":"nakadaka","o":"odaka"};
function pitchHTML(r,p){
  if(p===undefined||p===null||p===""||isNaN(+p)) return "<span>"+esc(r)+"</span>";
  p=+p; const m=morae(r); const n=m.length; const kind=pitchKind(n,p);
  let html="<span class='pitch pa-"+kind+"' title='"+PITCH_NAMES[kind]+"'>";
  m.forEach((x,i)=>{
    let hi; if(p===0) hi=i>0; else if(p===1) hi=i===0; else hi=i>0 && i<p;
    const drop = p>0 && i===p-1;
    html+="<span class='m"+(hi?" hi":"")+(drop?" drop":"")+"'>"+esc(x)+"</span>";
  });
  return html+"<span class='pn'>["+p+"]</span></span>";
}

/* ---------- mini markdown (with furigana) ---------- */
function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function inline(s){
  return furiHTML(esc(s)).replace(/\*\*(.+?)\*\*/g,"<strong>$1</strong>").replace(/(^|[^*])\*(?!\s)(.+?)\*(?!\*)/g,"$1<em>$2</em>");
}
function md(src){
  const lines=String(src||"").replace(/\r/g,"").split("\n"); let html="", i=0;
  while(i<lines.length){
    const l=lines[i];
    if(/^\s*\|/.test(l)){
      const rows=[]; while(i<lines.length && /^\s*\|/.test(lines[i])){ rows.push(lines[i]); i++; }
      const cells=r=>r.trim().replace(/^\|/,"").replace(/\|$/,"").split(/\|(?![^{]*\})/).map(c=>c.trim());
      let out="<table>"; let body=rows;
      if(rows.length>1 && /^\s*\|?\s*:?-{2,}/.test(rows[1])){ out+="<thead><tr>"+cells(rows[0]).map(c=>"<th>"+inline(c)+"</th>").join("")+"</tr></thead>"; body=rows.slice(2); }
      out+="<tbody>"+body.map(r=>"<tr>"+cells(r).map(c=>"<td>"+inline(c)+"</td>").join("")+"</tr>").join("")+"</tbody></table>";
      html+=out; continue;
    }
    if(/^\s*[-*]\s+/.test(l)){ let out="<ul>"; while(i<lines.length && /^\s*[-*]\s+/.test(lines[i])){ out+="<li>"+inline(lines[i].replace(/^\s*[-*]\s+/,""))+"</li>"; i++; } html+=out+"</ul>"; continue; }
    if(/^\s*\d+[.)]\s+/.test(l)){ let out="<ol>"; while(i<lines.length && /^\s*\d+[.)]\s+/.test(lines[i])){ out+="<li>"+inline(lines[i].replace(/^\s*\d+[.)]\s+/,""))+"</li>"; i++; } html+=out+"</ol>"; continue; }
    if(/^#{1,4}\s+/.test(l)){ html+="<h3>"+inline(l.replace(/^#+\s+/,""))+"</h3>"; i++; continue; }
    if(!l.trim()){ i++; continue; }
    const para=[]; while(i<lines.length && lines[i].trim() && !/^\s*(\||[-*]\s|\d+[.)]\s|#)/.test(lines[i])){ para.push(lines[i]); i++; }
    html+="<p>"+para.map(inline).join("<br>")+"</p>";
  }
  return '<div class="md">'+html+"</div>";
}

/* ---------- validation ---------- */
const KINDS=["multiple_choice","fill_blank","translate","match","order","dictation","kanji_write"];
const TYPES=["reading","grammar","vocab","exercises","writing","speaking","kanji","placement"];
function validateWeek(w){
  if(!w || typeof w!=="object") return "Not a JSON object.";
  if(!Number.isInteger(w.week)) return "\"week\" must be a whole number.";
  if(!parseDate(w.startDate)) return "\"startDate\" must look like 2026-11-23.";
  if(!Array.isArray(w.days) || !w.days.length) return "\"days\" must be a non-empty list.";
  if(w.cards!==undefined){
    if(!Array.isArray(w.cards)) return "\"cards\" must be a list.";
    const cid=new Set();
    for(const c of w.cards){
      if(!c || !c.id || !c.en || !c.de) return "Each card needs id, en and de.";
      if(cid.has(c.id)) return "Duplicate card id \""+c.id+"\".";
      cid.add(c.id);
      if(c.type && ["read","write"].indexOf(c.type)<0) return "Card "+c.id+": type must be read or write.";
      if(c.type==="write" && (!c.kanji || String(c.de).indexOf(c.kanji)<0)) return "Card "+c.id+": a write card needs \"kanji\", and it must appear in \"de\".";
      if(c.pitch!==undefined && c.pitch!==null && !Number.isInteger(c.pitch)) return "Card "+c.id+": pitch must be a whole number.";
    }
  }
  const ids=new Set();
  for(const d of w.days){
    if(!Number.isInteger(d.day) || d.day<1 || d.day>7) return "Each day needs \"day\" from 1 to 7.";
    if(!Array.isArray(d.sections)) return "Day "+d.day+" has no \"sections\" list.";
    for(const s of d.sections){
      if(TYPES.indexOf(s.type)<0) return "Day "+d.day+": unknown section type \""+s.type+"\".";
      if(s.type==="exercises"){
        if(!Array.isArray(s.items)) return "Day "+d.day+": exercises need \"items\".";
        for(const it of s.items){
          if(!it.id) return "Day "+d.day+": an exercise has no \"id\".";
          if(ids.has(it.id)) return "Duplicate exercise id \""+it.id+"\".";
          ids.add(it.id);
          if(KINDS.indexOf(it.kind)<0) return "Item "+it.id+": unknown kind \""+it.kind+"\".";
          if(it.kind==="multiple_choice" && (!Array.isArray(it.options) || !Number.isInteger(it.answer))) return "Item "+it.id+": needs options and a numeric answer.";
          if(it.kind==="fill_blank" && !Array.isArray(it.answers)) return "Item "+it.id+": needs \"answers\".";
          if(it.kind==="translate" && !it.modelAnswer) return "Item "+it.id+": needs \"modelAnswer\".";
          if(it.kind==="match" && !Array.isArray(it.pairs)) return "Item "+it.id+": needs \"pairs\".";
          if(it.kind==="order" && !it.answer) return "Item "+it.id+": needs \"answer\".";
          if(it.kind==="dictation" && (!it.audio || !Array.isArray(it.answers))) return "Item "+it.id+": needs \"audio\" and \"answers\".";
          if(it.kind==="kanji_write" && (!it.kanji || !it.de)) return "Item "+it.id+": needs \"kanji\" and \"de\".";
        }
      }
      if(s.type==="kanji" && !Array.isArray(s.items)) return "Day "+d.day+": kanji section needs \"items\".";
    }
  }
  return null;
}

/* ---------- helpers ---------- */
const $ = id => document.getElementById(id);
function h(tag, attrs, html){ const e=document.createElement(tag); if(attrs) for(const k in attrs){ if(k==="class") e.className=attrs[k]; else if(k.indexOf("on")===0) e.addEventListener(k.slice(2),attrs[k]); else e.setAttribute(k,attrs[k]); } if(html!=null) e.innerHTML=html; return e; }
let toastT; function toast(msg){ const t=$("toast"); t.textContent=msg; t.classList.add("show"); clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove("show"),1800); }
function shuffle(a,rnd){ rnd=rnd||Math.random; const b=a.slice(); for(let i=b.length-1;i>0;i--){ const j=Math.floor(rnd()*(i+1)); [b[i],b[j]]=[b[j],b[i]]; } return b; }
function rng(seed){ let s=seed>>>0||1; return ()=>{ s^=s<<13; s>>>=0; s^=s>>>17; s^=s<<5; s>>>=0; return s/4294967296; }; }
async function copyText(txt){

/* ---------- audio: recorded VOICEVOX files (audio/<voice>/<key>.mp3), iPhone voice as fallback ---------- */
const FILE_VOICES={himari:"冥鳴ひまり (female)",takehiro:"玄野武宏 (male)"};   // recorded with tools/make_audio.py
const VOICE_CREDIT="VOICEVOX:冥鳴ひまり, VOICEVOX:玄野武宏";
function ttsClean(text){ return String(text==null?"":text).replace(/\*\*/g,"").replace(/^[\s–-]+/gm,"").replace(/…|\.\.\./g," ").replace(/\([^)]*\)|（[^）]*）/g," ").replace(/\s+/g," ").trim(); }
function audioKey(t){ const b=new TextEncoder().encode(t); let h=0x811C9DC5; for(let i=0;i<b.length;i++){ h=Math.imul((h^b[i])>>>0,0x01000193)>>>0; } return ("00000000"+h.toString(16)).slice(-8)+"-"+b.length; }
function voiceMode(){ const v=getCfg().voice; const first=Object.keys(FILE_VOICES)[0]; if(!v) return first||"device"; if(FILE_VOICES[v]||v==="device") return v; return first||"device"; }
function deviceVoiceURI(){ return getCfg().deviceVoice||""; }
const TTS={
  cur:null,
  voices(){ try{ return speechSynthesis.getVoices().filter(v=>/^ja([-_]|$)/i.test(v.lang)); }catch(e){ return []; } },
  pick(){ const vs=this.voices(); const want=deviceVoiceURI(); return vs.find(v=>v.voiceURI===want) || vs.find(v=>/ja[-_]JP/i.test(v.lang)) || vs[0] || null; },
  stop(){ try{ if(this.cur){ this.cur.pause(); this.cur=null; } }catch(e){} try{ speechSynthesis.cancel(); }catch(e){} },
  device(t){
    try{
      if(!("speechSynthesis" in window)) return;
      const u=new SpeechSynthesisUtterance(t); u.lang="ja-JP"; const v=this.pick(); if(v) u.voice=v; u.rate=getCfg().rate||0.9;
      speechSynthesis.speak(u);
    }catch(e){}
  },
  file(key,fallbackText){
    this.stop();
    const mode=voiceMode();
    if(mode==="device"){ this.device(fallbackText); return; }
    try{
      const a=new Audio("audio/"+mode+"/"+key+".mp3"); this.cur=a;
      try{ a.preservesPitch=true; a.playbackRate=getCfg().rate||1; }catch(e){}
      let fell=false; const fb=()=>{ if(fell || this.cur!==a) return; fell=true; this.cur=null; this.device(fallbackText); };
      a.addEventListener("error",fb);
      const p=a.play(); if(p && p.catch) p.catch(err=>{ if(err && err.name==="NotAllowedError") return; fb(); });
    }catch(e){ this.device(fallbackText); }
  },
  /* a sentence or passage, possibly with {漢字|かな} markup: spoken with the kana readings */
  say(text){ const t=ttsClean(kanaOf(text)); if(t) this.file(audioKey(t),t); },
  /* a single word: recorded from its kana reading with the pitch accent set; the iPhone voice reads the kanji form */
  word(de,reading,pitch){ const r=ttsClean(reading||""); if(!r){ this.say(de); return; } this.file(audioKey("w|"+r+"|"+(pitch===undefined||pitch===null?"":pitch)),ttsClean(baseOf(de))||r); }
};
try{ if("speechSynthesis" in window){ speechSynthesis.getVoices(); speechSynthesis.addEventListener("voiceschanged",()=>{}); } }catch(e){}

function correctText(it){
  switch(it.kind){
    case "multiple_choice": return (it.options||[])[it.answer];
    case "fill_blank": return (it.answers||[]).map(a=>Array.isArray(a)?a[0]:a).join(" / ");
    case "translate": return it.modelAnswer;
    case "match": return (it.pairs||[]).map(p=>p[0]+" = "+p[1]).join("; ");

function weekKeys(week){ const start=parseDate(week.startDate); const ks=new Set(); for(let i=0;i<7;i++){ const d=new Date(start); d.setDate(d.getDate()+i); ks.add(d.getFullYear()+"-"+pad2(d.getMonth()+1)+"-"+pad2(d.getDate())); } return ks; }
function buildReport(week){
  const res=getRes(week.week); const lines=[]; let done=0, right=0, total=0; const per=[]; const missed=[]; const overr=[]; const rate={writing:[],speaking:[]}; const notes=[]; const weak=new Set();
  const itemsById={}; week.days.forEach(d=>d.sections.forEach(s=>{ if(s.type==="exercises") s.items.forEach(it=>itemsById[it.id]={it,day:d.day}); }));
  for(let d=1; d<=7; d++){
    const dr=res.days[d]; if(!dr){ per.push("D"+d+" –"); continue; }
    if(dr.done) done++;
    const its=Object.values(dr.items); const r=its.filter(i=>i.correct).length; right+=r; total+=its.length;
    per.push("D"+d+" "+(its.length?Math.round(100*r/its.length)+"%":"–"));
    its.forEach(rec=>{
      const ref=itemsById[rec.id]; if(!ref) return; const it=ref.it;
      if(!rec.correct){
        missed.push("- [D"+d+" "+it.kind+" "+it.id+"] answered \""+(rec.userAnswer||"")+"\" → correct \""+baseOf(correctText(it))+"\" (topic: "+(it.topic||"–")+")");
        (it.words||[]).forEach(w=>weak.add(w)); if(it.kind==="kanji_write") weak.add(it.de);
      }
      if(rec.overridden) overr.push("- [D"+d+" "+it.id+"] mine: \""+rec.userAnswer+"\" | model: \""+it.modelAnswer+"\"");
    });
    Object.values(dr.ratings||{}).forEach(x=>{ if(rate[x.type] && x.value) rate[x.type].push(x.value); });
    if(dr.notes && dr.notes.trim()) notes.push("D"+d+": "+dr.notes.trim());
  }
  const avg=a=>a.length?(Math.round(10*a.reduce((x,y)=>x+y,0)/a.length)/10)+"/3":"–";
  lines.push("PROGRESS REPORT — Week "+week.week+" ("+week.startDate+")");
  lines.push("Days completed: "+done+"/7   Overall score: "+(total?Math.round(100*right/total)+"%":"–"));
  lines.push("Per day: "+per.join(" | "));
  const mins=[1,2,3,4,5,6,7].map(d=>{ const dr=res.days[d]; return dr&&dr.timeMs?("D"+d+" "+Math.round(dr.timeMs/60000)+"m"):null; }).filter(Boolean);
  if(mins.length) lines.push("Time: "+mins.join(" | "));
  lines.push("Missed items:"); lines.push(missed.length?missed.join("\n"):"- none");
  lines.push("Overridden translations:"); lines.push(overr.length?overr.join("\n"):"- none");
  const cr=cardReportLines(week); cr.weak.forEach(w=>weak.add(w));
  lines.push("Weak words (missed ≥1x): "+(weak.size?Array.from(weak).join(", "):"none"));
  lines.push("Self-ratings: writing "+avg(rate.writing)+", speaking "+avg(rate.speaking));
  cr.lines.forEach(l=>lines.push(l));
  const ks=weekKeys(week); const lk={}; (store.get("lookups",[])||[]).forEach(r=>{ if(ks.has(dayKeyOf(r[1]*1000))) lk[r[0]]=(lk[r[0]]||0)+1; });
  const lkl=Object.keys(lk).sort((a,b)=>lk[b]-lk[a]);
  lines.push("Reading lookups (tapped for furigana): "+(lkl.length?lkl.map(w=>w+" ×"+lk[w]).join(", "):"none"));
  lines.push("My notes: "+(notes.length?notes.join(" | "):"–"));
  return lines.join("\n");
}

const P={ week:null, d:0, i:0, res:null, dr:null, t0:0 };
function openPlayer(week,d){
  P.week=week; P.d=d; P.res=getRes(week.week); P.dr=dayRes(P.res,d);
  const day=week.days.find(x=>x.day===d);
  P.day=day; P.i = P.dr.done ? 0 : Math.min(P.dr.last||0, day.sections.length);
  P.t0=Date.now();
  $("player").classList.add("open"); document.body.style.overflow="hidden";
  showSection();
}
function stopTimer(){ if(P.t0){ P.dr.timeMs=(P.dr.timeMs||0)+(Date.now()-P.t0); P.t0=0; persist(); } }
function persist(){ P.res.days[P.d]=P.dr; saveRes(P.week.week,P.res); }
function closePlayer(){ stopTimer(); TTS.stop(); $("player").classList.remove("open"); document.body.style.overflow=""; render(); }
document.addEventListener("visibilitychange",()=>{ if(!$("player").classList.contains("open")) return; if(document.hidden) stopTimer(); else P.t0=Date.now(); });
$("pClose").addEventListener("click",closePlayer);
$("pBack").addEventListener("click",()=>{ if(P.i>0){ P.i--; showSection(); } });
$("pNext").addEventListener("click",()=>{
  const n=P.day.sections.length;
  if(P.i<n){ P.i++; showSection(); }
  else { P.dr.done=true; persist(); closePlayer(); toast("Day "+P.d+" done"); }
});
function showSection(){
  TTS.stop();
  const n=P.day.sections.length; const body=$("pBody"); body.innerHTML=""; body.scrollTop=0;
  $("pTitle").innerHTML="Day "+P.d+" · "+inline(P.day.title||"");
  if(P.i<n && P.dr.visited.indexOf(P.i)<0) P.dr.visited.push(P.i);
  P.dr.last=P.i; persist();
  $("pBar").style.width=Math.round(100*Math.min(P.dr.visited.length,n)/n)+"%";
  $("pCount").textContent = P.i<n ? (P.i+1)+"/"+n : "End";
  $("pBack").disabled = P.i===0;
  $("pNext").textContent = P.i<n ? "Next ›" : "Finish ✓";

const STROKES={};
function strokeURL(k){ return "strokes/"+k.codePointAt(0).toString(16).padStart(5,"0")+".json"; }
async function loadStrokes(k){
  if(STROKES[k]) return STROKES[k];
  const url=strokeURL(k); let data=null;
  try{ const r=await fetch(url); if(r.ok){ data=await r.json(); try{ const c=await caches.open("nh-strokes-v1"); await c.put(url,new Response(JSON.stringify(data),{headers:{"Content-Type":"application/json"}})); }catch(e){} } }catch(e){}
  if(!data){ try{ const c=await caches.open("nh-strokes-v1"); const m=await c.match(url); if(m) data=await m.json(); }catch(e){} }
  if(data) STROKES[k]=data;
  return data;
}
/* keep stroke data for every writing card on the phone, so writing works offline */
async function prefetchCardStrokes(){
  const want=new Set(); allCards().forEach(c=>{ if(c.type==="write" && c.kanji) want.add(c.kanji); });
  let have=new Set(); try{ const c=await caches.open("nh-strokes-v1"); (await c.keys()).forEach(r=>{ const m=/strokes\/([0-9a-f]+)\.json/.exec(r.url); if(m) have.add(String.fromCodePoint(parseInt(m[1],16))); }); }catch(e){ return; }

function resample(pts,n){

  return out;
}

function makePad(host,opt){

  const svg=svgEl("svg",{viewBox:"0 0 109 109"}); gridLines(svg);
  const ghostG=svgEl("g",{}), doneG=svgEl("g",{}), hintG=svgEl("g",{}); svg.appendChild(ghostG); svg.appendChild(doneG); svg.appendChild(hintG);

  const btn=(label,fn,cls)=>{ const b=h("button",{class:cls||""},label); b.addEventListener("click",fn); bar.appendChild(b); return b; };
  function setupBar(){
    bar.innerHTML="";

      btn("Clear",()=>{ if(st.done) return; st.ink=[]; redraw(); });
      btn("Check ✓",()=>{ if(st.done||!st.data) return; revealAll(true); msg.textContent="Compare with the model. Was yours right (shape and stroke order)?";
        bar.innerHTML=""; btn("✗ Not right",()=>finish({selfOk:false})); btn("✓ Right",()=>finish({selfOk:true}),"primary"); },"primary");
    } else {

      btn(opt.practice?"Show":"I don't know",()=>{ if(st.done||!st.data) return; revealAll(true); msg.textContent=""; finish({gaveUp:true}); });
    }
  }

  cv.addEventListener("pointermove",e=>{ if(!cur) return; e.preventDefault(); let evs=e.getCoalescedEvents?e.getCoalescedEvents():null; if(!evs||!evs.length) evs=[e]; evs.forEach(ev=>{ const p=pos(ev); const q=cur[cur.length-1]; cur.push(p); ctx.beginPath(); ctx.moveTo(q[0],q[1]); ctx.lineTo(p[0],p[1]); ctx.stroke(); }); });
  const up=e=>{ if(!cur) return; const s=cur; cur=null; onStroke(s); };
  cv.addEventListener("pointerup",up); cv.addEventListener("pointercancel",up);
  ["touchstart","touchmove"].forEach(t=>wrap.addEventListener(t,e=>e.preventDefault(),{passive:false}));

  });

function suggestedRating(r){

/* ================= FLASHCARDS (spaced repetition with FSRS) ================= */
const DAY_START_HOUR = 4;
function studyDay(d){ const x=new Date(d===undefined?Date.now():d); x.setHours(x.getHours()-DAY_START_HOUR); return new Date(x.getFullYear(),x.getMonth(),x.getDate()); }
function dayKeyOf(d){ const x=studyDay(d); return x.getFullYear()+"-"+pad2(x.getMonth()+1)+"-"+pad2(x.getDate()); }
function endOfStudyDay(){ const s=studyDay(); return new Date(s.getFullYear(),s.getMonth(),s.getDate()+1,DAY_START_HOUR); }
const CFG_DEFAULT={ newRead:7, newWrite:3, retention:0.9, autoplay:true, voice:"", rate:1, writeMode:"strict", leniency:1, furigana:"auto" };
function getCfg(){ return Object.assign({},CFG_DEFAULT,store.get("cfg",{})||{}); }
function setCfg(patch){ store.set("cfg",Object.assign(getCfg(),patch)); SCHED=null; KNOWN=null; }
let SCHED=null;
function sched(){
  if(!SCHED){ const F=window.FSRS; SCHED=F.fsrs(F.generatorParameters({request_retention:getCfg().retention, enable_fuzz:true})); }
  return SCHED;
}
function ser(c){ return {due:+c.due,s:c.stability,d:c.difficulty,ed:c.elapsed_days,sd:c.scheduled_days,ls:c.learning_steps||0,r:c.reps,l:c.lapses,st:c.state,lr:c.last_review?+c.last_review:null}; }
function deser(o){ return {due:new Date(o.due),stability:o.s,difficulty:o.d,elapsed_days:o.ed,scheduled_days:o.sd,learning_steps:o.ls||0,reps:o.r,lapses:o.l,state:o.st,last_review:o.lr?new Date(o.lr):undefined}; }
function allCards(){
  const out=[];
  knownWeeks().forEach(e=>{
    const w=getWeek(e.week); if(!w || !Array.isArray(w.cards)) return;
    const start=parseDate(w.startDate);
    w.cards.forEach((c,i)=>{ const avail=new Date(start); avail.setDate(avail.getDate()+((c.day||1)-1));
      out.push(Object.assign({type:"read"},c,{week:w.week,order:w.week*10000+i,avail})); });
  });
  return out;
}
function seedIntroduced(cards){
  const srs=store.get("srs",{}); let changed=false; const now=new Date(); const F=window.FSRS;
  cards.forEach(c=>{
    if(srs[c.id] || !c.introduced) return; const d=parseDate(c.introduced); if(!d) return; d.setHours(9);
    if(d>now) return;
    let card=F.createEmptyCard(d);
    card=sched().next(card,d,F.Rating.Good).card;
    card=sched().next(card,new Date(+d+10*60000),F.Rating.Good).card;
    srs[c.id]=ser(card); changed=true;
  });
  if(changed) store.set("srs",srs);
}
function newDoneToday(){
  const k=dayKeyOf(); const byId={}; allCards().forEach(c=>byId[c.id]=c); const out={read:0,write:0};
  (store.get("revlog",[])||[]).forEach(r=>{ if(r[3]===0 && dayKeyOf(r[1]*1000)===k){ const c=byId[r[0]]; out[(c&&c.type==="write")?"write":"read"]++; } });
  return out;
}
function queueState(){
  const cards=allCards(); seedIntroduced(cards);
  const srs=store.get("srs",{}); const now=Date.now(); const eod=+endOfStudyDay(); const td=studyDay();
  const learn=[], rev=[], fresh=[];
  cards.forEach(c=>{
    const s=srs[c.id];
    if(!s){ if(c.avail<=td) fresh.push(c); return; }
    if(s.st===1 || s.st===3) learn.push({c,due:s.due});
    else if(s.due<eod) rev.push({c,due:s.due});
  });
  learn.sort((a,b)=>a.due-b.due); rev.sort((a,b)=>a.due-b.due); fresh.sort((a,b)=>a.order-b.order);
  const cf=getCfg(); const done=newDoneToday();
  const left={read:Math.max(0,cf.newRead-done.read), write:Math.max(0,cf.newWrite-done.write)};
  const eligible=fresh.filter(c=>left[c.type==="write"?"write":"read"]>0);
  const nR=Math.min(left.read,fresh.filter(c=>c.type!=="write").length), nW=Math.min(left.write,fresh.filter(c=>c.type==="write").length);
  return {cards,learn,rev,fresh:eligible,left,now,
    counts:{ newCount:nR+nW, newRead:nR, newWrite:nW, learnCount:learn.filter(x=>x.due<eod).length, revCount:rev.length, total:cards.length }};
}
const LEARN_AHEAD_MS=20*60000;
function pickNext(q,shown){
  const dueLearn=q.learn.filter(x=>x.due<=q.now);
  if(dueLearn.length) return dueLearn[0].c;
  const canNew=q.fresh.length>0;
  if(q.rev.length && (!canNew || shown%4!==3)) return q.rev[0].c;
  if(canNew) return q.fresh[0];
  if(q.rev.length) return q.rev[0].c;
  const ahead=q.learn.filter(x=>x.due<=q.now+LEARN_AHEAD_MS);
  if(ahead.length) return ahead[0].c;
  return null;
}
function fmtIvl(ms){
  const m=ms/60000; if(m<60) return Math.max(1,Math.round(m))+"m";
  const hh=m/60; if(hh<24) return Math.round(hh)+"h";
  const d=hh/24; if(d<30) return Math.round(d)+"d";
  if(d<365) return (Math.round(d/3)/10)+"mo";
  return (Math.round(d/36.5)/10)+"y";
}

/* ---------- images: Openverse (openly licensed, mature content excluded); shown on the answer side only ---------- */
function imgMap(){ return store.get("img",{})||{}; }
function imgGet(id){ return imgMap()[id]||null; }
function imgSet(id,v){ const m=imgMap(); m[id]=v; store.set("img",m); }
function licLabel(x){ const l=String(x.license||"").toLowerCase(); if(l==="cc0") return "CC0"; if(l==="pdm") return "Public domain"; return "CC "+l.toUpperCase()+(x.license_version?" "+x.license_version:""); }
async function ovSearch(q,page){
  const r=await fetch("https://api.openverse.org/v1/images/?q="+encodeURIComponent(q)+"&page_size=20&page="+page+"&mature=false");
  if(r.status===429) throw new Error("busy");
  if(!r.ok) throw new Error("HTTP "+r.status);
  const j=await r.json();
  return (j.results||[]).filter(x=>x.url||x.thumbnail).map(x=>({u:x.thumbnail||x.url,o:x.url||"",c:[x.creator||"",licLabel(x)].filter(Boolean).join(" · "),l:x.foreign_landing_url||x.url||""}));
}
async function imgNext(c){
  let e=imgGet(c.id)||{q:c.img||c.en,list:[],i:-1,page:0,hidden:false};
  e.hidden=false;
  if(e.i+1<e.list.length){ e.i++; imgSet(c.id,e); return null; }
  try{
    const more=await ovSearch(e.q,e.page+1);
    if(!more.length){ imgSet(c.id,e); return e.list.length?"No more images. Showing the first again.":"No images found."; }
    e.page++; e.list=e.list.concat(more); e.i++; imgSet(c.id,e); return null;
  }catch(err){
    if(e.list.length){ e.i=0; imgSet(c.id,e); }
    else { const m=imgMap(); delete m[c.id]; store.set("img",m); }
    return err.message==="busy" ? "The free image search is busy. Try “Next image” again later." : "Image search failed (offline?).";
  }
}
function imgHide(c){ const e=imgGet(c.id)||{q:c.img||c.en,list:[],i:-1,page:0}; e.hidden=true; imgSet(c.id,e); }
function imgCurrent(c){ const e=imgGet(c.id); if(!e || e.hidden || e.i<0 || !e.list[e.i]) return null; return e.list[e.i]; }
function wantsAutoImage(c){ const e=imgGet(c.id); return !!c.img && !e; }
function imgBox(c){
  const box=h("div",{class:"imgbox"}); const cur=imgCurrent(c);
  if(cur){
    const im=h("img",{src:cur.u,alt:c.en,loading:"lazy"});
    im.addEventListener("error",()=>{ if(cur.o && im.src!==cur.o) im.src=cur.o; else { im.remove(); box.appendChild(h("p",{class:"muted small"},"Image didn't load.")); } });
    box.appendChild(im);

async function saveFile(name,text,mime){
  try{
    const f=new File([text],name,{type:mime});
    if(navigator.canShare && navigator.canShare({files:[f]})){ await navigator.share({files:[f],title:name}); return true; }
  }catch(e){ if(e && e.name==="AbortError") return false; }
  try{
    const url=URL.createObjectURL(new Blob([text],{type:mime}));
    const a=h("a",{href:url,download:name}); document.body.appendChild(a); a.click();
    setTimeout(()=>{ URL.revokeObjectURL(url); a.remove(); },3000); return true;
  }catch(e){ toast("Could not save the file"); return false; }
}

function cardReportLines(week){
  const ks=weekKeys(week);
  const log=(store.get("revlog",[])||[]).filter(r=>ks.has(dayKeyOf(r[1]*1000)));
  const byId={}; allCards().forEach(c=>byId[c.id]=c);
  const out={lines:[],weak:[]};
  if(!log.length) out.lines.push("Flashcards: no reviews this week");
  else {
    const nw=log.filter(r=>r[3]===0).length; const revs=log.filter(r=>r[3]===2);
    const ok=revs.filter(r=>r[2]>1).length;
    const wr=log.filter(r=>byId[r[0]]&&byId[r[0]].type==="write");
    const again={}; log.filter(r=>r[2]===1).forEach(r=>{ again[r[0]]=(again[r[0]]||0)+1; });
    const ids=Object.keys(again).sort((a,b)=>again[b]-again[a]);
    out.weak=ids.map(id=>byId[id]?baseOf(byId[id].de):id);
    out.lines.push("Flashcards: "+log.length+" reviews ("+nw+" new cards; "+wr.length+" were writing reviews), retention "+(revs.length?Math.round(100*ok/revs.length)+"% on "+revs.length+" mature reviews":"– (no mature reviews yet)"));
    out.lines.push("Cards rated Again: "+(ids.length?ids.map(id=>(byId[id]?baseOf(byId[id].de)+(byId[id].type==="write"?" ✍":""):id)+" ×"+again[id]).join(", "):"none"));
  }

function baseKanji(){

    .sort((a,b)=>((kdb[a].g||30)-(kdb[b].g||30))||(kdb[b].l-kdb[a].l)||((kdb[a].f||9999)-(kdb[b].f||9999)));

function plSeed(){ const pl=getPL(); if(!pl.seed){ pl.seed=1+Math.floor(Math.random()*2147483646); savePL(); } return pl.seed; }
function plItems(part){

  if(part===4){ const base=new Set(baseKanji()); const r=rng(plSeed()+4);
    const pick=(lv,n)=>shuffle(Object.keys(kdb).filter(k=>kdb[k].l===lv && kdb[k].kw && !base.has(k)).sort(),r).slice(0,n).map(k=>({id:k,kind:"read",lv}));
    return pick(3,100).concat(pick(2,60)); }

      sel.forEach(e=>{ const others=shuffle(pool.filter(x=>x.m!==e.m),r).slice(0,3).map(x=>x.m); const opts=shuffle([e.m].concat(others),r);

function placementSummary(){

  const a6=A(6);
  if(PLDATA){
    const g=PLDATA.grammar; const lv={}; g.forEach(x=>{ lv[x.level]=lv[x.level]||[0,0]; if(a6[x.id]){ lv[x.level][1]++; if(a6[x.id].ok) lv[x.level][0]++; } });
    const gm=g.filter(x=>a6[x.id] && !a6[x.id].ok).map(x=>x.id+" "+x.topic);
    L.push("Grammar: "+Object.keys(lv).map(k=>k+" "+lv[k][0]+"/"+lv[k][1]).join(", ")+(gm.length?" · missed: "+gm.join("; "):""));
    const d=PLDATA.dictation.filter(x=>a6[x.id]); const dx=d.filter(x=>a6[x.id].ok); const avg=d.length?Math.round(d.reduce((s,x)=>s+(a6[x.id].sim||0),0)/d.length):0;
    L.push("Dictation: exact "+dx.length+"/"+d.length+", avg match "+avg+"%"+(d.length>dx.length?" · misses: "+d.filter(x=>!a6[x.id].ok).map(x=>x.id+" ("+a6[x.id].sim+"%) \""+a6[x.id].ua+"\"").join("; "):""));
  }
  L.push("Writing mode: "+getCfg().writeMode+", tolerance "+getCfg().leniency);
  return L.join("\n");
}

boot();
</script>
